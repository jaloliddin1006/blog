services:
  site:
    build: .
    image: mamatmusayev
    ports:
      - '8081:8080'
    environment:
      # Change these before putting the container anywhere public.
      STUDIO_USER: ${STUDIO_USER:-defonic}
      STUDIO_PASSWORD: ${STUDIO_PASSWORD:-defonic}
      # Leave unset on first run: a secret is generated and printed in the log,
      # then kept in data/studio-secret.json so it survives restarts.
      STUDIO_TOTP_SECRET: ${STUDIO_TOTP_SECRET:-NBSWY3DPEHPK3PXP}
      # Set to true when a TLS proxy sits in front, so the cookie is Secure.
      STUDIO_SECURE_COOKIE: ${STUDIO_SECURE_COOKIE:-false}
    volumes:
      - ./data:/app/data
      - ./public/projects:/app/public/projects
    restart: unless-stopped
